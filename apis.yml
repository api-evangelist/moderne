aid: moderne
name: Moderne
description: >-
  Moderne is a deterministic, large-scale code transformation and mass-remediation
  platform built on the open-source OpenRewrite framework and its Lossless Semantic
  Trees (LST) — compiler-accurate, format-preserving models of source code. Moderne
  sequences codebases (from one repository to 100,000) into type-attributed LSTs and
  runs 10,000+ deterministic recipes across 40+ domains and 10+ languages to drive
  automated refactoring, framework and dependency migrations, security patching, and
  code governance with verifiable, regression-free results. The platform exposes a
  GraphQL API for recipe execution and commits, a first-party CLI (mod), local and
  hosted Model Context Protocol (MCP) servers plus bundled Agent Skills for AI coding
  agents, and Moddy, a multi-repo AI agent. Delivered as the Moderne Platform (SaaS)
  and Moderne DX (air-gapped, on-premises). Backed by True Ventures.
